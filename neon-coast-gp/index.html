<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
'use strict';
const QS = new URLSearchParams(location.search);
const AUTO = QS.has('auto');
/* ============ BAHASA ============ */
const STR = {
  id: { tagline:'🌃 Balap mobil di kota malam luar negeri — 8 pembalap dunia, wajah asli, grafik WOW!', posisi:'POSISI', gaya:'GAYA', rem:'REM',
    day:'🌤️ MODE SIANG — KOTA', dayD:'Gedung tinggi + jalan lebar. Balapan santai tapi cepat!',
    sun:'🌅 MODE SENJA — GOLDEN HOUR', sunD:'Langit oranye di antara gedung. Paling sinematik!',
    night:'🌧️ MODE MALAM — HUJAN NEON', nightD:'Kota hujan kayak Jakarta Underworld: jalan basah mengkilap, lampu jalan + neon menyala!',
    top:'Top', acc:'Aksel', buy:'Beli', locked:'🔒 ', owned:'Dipakai ✓', use:'Pakai',
    finish:'🏁 FINISH!', you:'KAMU', coinsGet:'Koin didapat: +', again:'🔁 BALAP LAGI', menu:'🏠 MENU',
    go:'GAS! 🏁', crash:'TABRAKAN! 💥', nearmiss:'HAMPIR! +GAYA', boost:'BOOST GAYA! ✨', offroad:'KELUAR JALUR!',
    place:['JUARA 1!! 🏆','POSISI 2 🥈','POSISI 3 🥉','POSISI 4','POSISI 5','POSISI 6','POSISI 7','POSISI 8'],
    garage:'🚗 GARASI', rivals:'PEMBALAP DUNIA' },
  en: { tagline:'🌃 Night-city car racing abroad — 8 world racers, real faces, WOW graphics!', posisi:'POSITION', gaya:'STYLE', rem:'BRAKE',
    day:'🌤️ DAY MODE — THE CITY', dayD:'Tall buildings + wide streets. Fast and chill!',
    sun:'🌅 SUNSET — GOLDEN HOUR', sunD:'Orange sky between the towers. Most cinematic!',
    night:'🌧️ NIGHT MODE — NEON RAIN', nightD:'Rainy city like Jakarta Underworld: wet shiny streets, lamps + neon on!',
    top:'Top', acc:'Accel', buy:'Buy', locked:'🔒 ', owned:'Equipped ✓', use:'Use',
    finish:'🏁 FINISH!', you:'YOU', coinsGet:'Coins earned: +', again:'🔁 RACE AGAIN', menu:'🏠 MENU',
    go:'GO! 🏁', crash:'CRASH! 💥', nearmiss:'NEAR MISS! +STYLE', boost:'STYLE BOOST! ✨', offroad:'OFF ROAD!',
    place:['WINNER!! 🏆','PLACE 2 🥈','PLACE 3 🥉','PLACE 4','PLACE 5','PLACE 6','PLACE 7','PLACE 8'],
    garage:'🚗 GARAGE', rivals:'WORLD RACERS' }
};
let lang = localStorage.getItem('ncg_lang') || 'id';
const T = k => (STR[lang] && STR[lang][k]) || STR.id[k] || k;
/* ============ SIMPANAN ============ */
let SAVE = { coins: 0, car: 0, owned: [true, false, false] };
try { const s = JSON.parse(localStorage.getItem('ncg1')); if (s && typeof s.coins === 'number') SAVE = s; } catch(e) {}
function persist(){ try { localStorage.setItem('ncg1', JSON.stringify(SAVE)); } catch(e) {} }
/* ============ AUDIO ============ */
let AC = null, engOsc = null, engOsc2 = null, engGain = null, masterGain = null;
function audioInit(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = (document.getElementById('vol').value / 100) * .9; masterGain.connect(AC.destination);
    engOsc = AC.createOscillator(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 55;
    engOsc2 = AC.createOscillator(); engOsc2.type = 'square'; engOsc2.frequency.value = 28;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 520; f.Q.value = 2;
    engGain = AC.createGain(); engGain.gain.value = 0;
    engOsc.connect(f); engOsc2.connect(f); f.connect(engGain); engGain.connect(masterGain);
    engOsc.start(); engOsc2.start();
  } catch(e) { AC = null; }
}
function beep(fr, dur, type, vol, slide){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.value = fr;
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime + dur);
  g.gain.setValueAtTime(vol || .2, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
  o.connect(g); g.connect(masterGain); o.start(); o.stop(AC.currentTime + dur);
}
function noiseHit(vol){
  if (!AC) return;
  const len = AC.sampleRate * .22, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const g = AC.createGain(); g.gain.value = vol || .5;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
  src.connect(f); f.connect(g); g.connect(masterGain); src.start();
}
document.getElementById('vol').addEventListener('input', e => { if (masterGain) masterGain.gain.value = (e.target.value / 100) * .9; });
/* ============ INPUT ============ */
const input = { steer: 0, gas: false, brk: false, nitro: false };
function bindBtn(id, on, off){
  const el = document.getElementById(id);
  const start = e => { e.preventDefault(); audioInit(); el.classList.add('on'); on(); };
  const end = e => { e.preventDefault(); el.classList.remove('on'); off(); };
  el.addEventListener('touchstart', start, { passive: false }); el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
  el.addEventListener('mousedown', start); el.addEventListener('mouseup', end); el.addEventListener('mouseleave', end);
}
bindBtn('btnL', () => input.steer = -1, () => { if (input.steer < 0) input.steer = 0; });
bindBtn('btnR', () => input.steer = 1, () => { if (input.steer > 0) input.steer = 0; });
bindBtn('btnGas', () => input.gas = true, () => input.gas = false);
bindBtn('btnBrk', () => input.brk = true, () => input.brk = false);
bindBtn('btnNitro', () => input.nitro = true, () => input.nitro = false);
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') input.steer = -1;
  if (e.key === 'ArrowRight' || e.key === 'd') input.steer = 1;
  if (e.key === 'ArrowUp' || e.key === 'w') input.gas = true;
  if (e.key === 'ArrowDown' || e.key === 's') input.brk = true;
  if (e.key === ' ') input.nitro = true;
});
addEventListener('keyup', e => {
  if (['ArrowLeft','a','ArrowRight','d'].includes(e.key)) input.steer = 0;
  if (['ArrowUp','w'].includes(e.key)) input.gas = false;
  if (['ArrowDown','s'].includes(e.key)) input.brk = false;
  if (e.key === ' ') input.nitro = false;
});
/* ============ TEKSTUR CANVAS ============ */
function canvasTex(draw, w, h, rx, ry){
  const c = document.createElement('canvas'); c.width = w || 256; c.height = h || 256;
  draw(c.getContext('2d'), c.width, c.height);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx || 1, ry || 1);
  return t;
}
/* wajah digambar per pembalap: kulit, mata, alis, hidung, mulut + varian */
function faceCanvas(p){
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = p.skin; x.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 260; i++){ x.fillStyle = 'rgba(120,72,30,.06)'; x.fillRect(Math.random() * 128, Math.random() * 128, 2, 2); }
  x.fillStyle = 'rgba(255,255,255,.10)'; x.fillRect(0, 0, 128, 30);
  x.fillStyle = '#fff';
  x.beginPath(); x.ellipse(42, 56, 13, 8, 0, 0, 7); x.fill();
  x.beginPath(); x.ellipse(86, 56, 13, 8, 0, 0, 7); x.fill();
  x.fillStyle = p.eye || '#2b1c10';
  x.beginPath(); x.arc(42, 57, 5.4, 0, 7); x.fill();
  x.beginPath(); x.arc(86, 57, 5.4, 0, 7); x.fill();
  x.fillStyle = '#fff';
  x.beginPath(); x.arc(44, 55, 1.8, 0, 7); x.fill();
  x.beginPath(); x.arc(88, 55, 1.8, 0, 7); x.fill();
  x.strokeStyle = p.hair; x.lineWidth = 5; x.lineCap = 'round';
  x.beginPath(); x.moveTo(29, 44); x.lineTo(55, 41); x.stroke();
  x.beginPath(); x.moveTo(73, 41); x.lineTo(99, 44); x.stroke();
  if (p.female){
    x.strokeStyle = '#1c1c1c'; x.lineWidth = 2;
    for (let i = -1; i <= 1; i++){
      x.beginPath(); x.moveTo(31 + i * 3, 49); x.lineTo(28 + i * 3, 44); x.stroke();
      x.beginPath(); x.moveTo(97 + i * 3, 49); x.lineTo(100 + i * 3, 44); x.stroke();
    }
    x.fillStyle = 'rgba(255,110,140,.35)';
    x.beginPath(); x.ellipse(24, 84, 10, 6, 0, 0, 7); x.fill();
    x.beginPath(); x.ellipse(104, 84, 10, 6, 0, 0, 7); x.fill();
  }
  x.strokeStyle = 'rgba(120,66,30,.75)'; x.lineWidth = 3;
  x.beginPath(); x.moveTo(64, 62); x.lineTo(60, 78); x.lineTo(67, 79); x.stroke();
  if (p.shades){
    x.fillStyle = '#0d0d12';
    x.fillRect(24, 47, 34, 17); x.fillRect(70, 47, 34, 17); x.fillRect(56, 52, 16, 5);
    x.fillStyle = 'rgba(120,220,255,.5)'; x.fillRect(28, 50, 12, 5); x.fillRect(74, 50, 12, 5);
  }
  x.strokeStyle = p.female ? '#c23b4e' : '#8a4b32'; x.lineWidth = p.female ? 5 : 4;
  x.beginPath();
  if (p.grin){ x.arc(64, 92, 15, .25, Math.PI - .25); }
  else { x.moveTo(50, 97); x.lineTo(78, 97); }
  x.stroke();
  if (p.grin){ x.fillStyle = '#fff'; x.fillRect(53, 96, 22, 5); }
  if (p.beard){
    x.fillStyle = p.hair;
    x.fillRect(34, 96, 60, 32); x.fillRect(30, 78, 10, 34); x.fillRect(88, 78, 10, 34);
    x.fillStyle = p.skin; x.fillRect(50, 94, 28, 9);
  }
  if (p.mustache){ x.fillStyle = p.hair; x.fillRect(48, 88, 32, 8); }
  if (p.stubble){ x.fillStyle = 'rgba(40,26,16,.35)'; x.fillRect(38, 92, 52, 26); }
  return c;
}
function faceTexture(p){ const t = new THREE.CanvasTexture(faceCanvas(p)); return t; }
</script>


<script>
/* ============ DUNIA 3D ============ */
const container = document.getElementById('game');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87c5e8);
scene.fog = new THREE.FogExp2(0xcfe8f5, .0016);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, .1, 3200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const hemi = new THREE.HemisphereLight(0xcfe5ff, 0x54604a, .9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(120, 220, 80); scene.add(sun);
/* kubah langit gradien + matahari + awan */
function skyTexture(top, mid, bot){
  return canvasTex((x, w, h) => {
    const g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, top); g.addColorStop(.55, mid); g.addColorStop(1, bot);
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  }, 64, 512);

{

    x += Math.sin(hd) * (TRACK_LEN / NSEG); z += Math.cos(hd) * (TRACK_LEN / NSEG);

  for (let i = 0; i <= NSEG; i++){

}
function trackAt(s){

  return { x: CX[i] + (CX[i + 1] - CX[i]) * u, y: CY[i] + (CY[i + 1] - CY[i]) * u, z: CZ[i] + (CZ[i + 1] - CZ[i]) * u, h: CH[i] + (CH[i + 1] - CH[i]) * u };

function ribbon(width, yOff, mat, uvScale){
  const pos = [], uv = [], idx = [];

    uv.push(0, i * (uvScale || 1), 1, i * (uvScale || 1));
    if (i < NSEG){ const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

function tickP(pool, dt, grav, drag){
  const arr = pool.pts.geometry.attributes.position.array;
  pool.data.forEach((d, j) => {
    if (d.life > 0){
      d.life -= dt; d.vy -= grav * dt;
      d.vx *= drag; d.vz *= drag;
      d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
      if (d.life <= 0) d.y = -999;
    }
    arr[j * 3] = d.x; arr[j * 3 + 1] = d.y; arr[j * 3 + 2] = d.z;
  });
  pool.pts.geometry.attributes.position.needsUpdate = true;
}

  tail.position.set(0, .66, -2.16); g.add(tail);

    ex.rotation.x = Math.PI / 2; ex.position.set(sx * .45, .3, -2.2); g.add(ex);
  }
  const flame = new THREE.Sprite(new THREE.SpriteMaterial({ map: canvasTex((x, w, h) => { const gr = x.createRadialGradient(32, 32, 2, 32, 32, 32); gr.addColorStop(0, 'rgba(160,220,255,1)'); gr.addColorStop(.4, 'rgba(255,160,40,.9)'); gr.addColorStop(1, 'rgba(255,80,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, w, h); }, 64, 64), depthWrite: false, transparent: true, opacity: 0 }));
  flame.position.set(0, .3, -2.5); flame.scale.set(.9, .9, 1); g.add(flame);
  /* roda */

function setRaceUI(on){

function computePlaces(){
  const arr = [...racers].sort((a, b) => (a.finished && b.finished) ? a.finTime - b.finTime : a.finished ? -1 : b.finished ? 1 : b.u - a.u);
  arr.forEach((r, idx) => r.place = idx + 1);
  return arr;
}
function finishRace(){

function step(dt){
  raceTime += dt;
  /* --- pemain --- */
  const P = player;
  if (!P.finished){
    const offroad = Math.abs(P.lat) > ROAD_W / 2;
    nitroOn = input.nitro && gaya > 2 && P.speed > 5;
    if (nitroOn) gaya = Math.max(0, gaya - 34 * dt);
    let topEff = P.def.top * (nitroOn ? 1.13 : 1);
    if (offroad) topEff *= .62;
    if (input.gas) P.speed += P.def.acc * dt * Math.max(0, 1 - P.speed / (topEff * 1.02));
    else P.speed -= (5 + P.speed * .35) * dt;
    if (input.brk) P.speed -= 30 * dt;
    if (offroad) P.speed -= 10 * dt;
    P.speed = Math.max(0, Math.min(P.speed, topEff * 1.06));
    const latRate = 11 * (.5 + .5 * Math.min(1, P.speed / P.def.top));
    const drifting = input.steer !== 0 && P.speed > 40 && !offroad;
    P.lat += input.steer * latRate * dt * (drifting ? 1.25 : 1);
    P.lat = Math.max(-13, Math.min(13, P.lat));
    if (drifting){ gaya = Math.min(100, gaya + 21 * dt); score += 12 * dt; }
    P.steerVis += ((input.steer) - P.steerVis) * Math.min(1, dt * 9);
    P.u += P.speed * dt;
    if (offroad && P.speed > 8 && Math.random() < .4){
      const pose = racerPose(P);
      spawnP(dust, pose.pos.x, pose.pos.y + .4, pose.pos.z, (Math.random() - .5) * 2, 1.6 + Math.random() * 2, (Math.random() - .5) * 2, .7);
    }
    /* tiang & palem */
    P.bumpCd -= dt;
    const hitSpot = (spots, rad) => {
      for (const sp of spots){
        if (Math.abs(sp.s - P.u) < 1.3 && Math.abs(sp.lat - P.lat) < rad && P.bumpCd <= 0){
          P.speed *= .32; P.bumpCd = .9; shake = .5;
          noiseHit(.5); showMsg(T('crash'), .9);
          const pose = racerPose(P);
          for (let k = 0; k < 10; k++) spawnP(sparks, pose.pos.x, pose.pos.y + .8, pose.pos.z, (Math.random() - .5) * 7, Math.random() * 5, (Math.random() - .5) * 7, .5);
          return true;
        }
      }
      return false;
    };
    hitSpot(lampSpots, 1.05) || hitSpot(palmSpots, 1.15);
    if (P.u >= TRACK_LEN){ P.finished = true; P.finTime = raceTime; finDelay = 1.4; showMsg(T('finish'), 1.6); beep(880, .4, 'sine', .25, 1320); }
  }
  /* --- AI --- */
  for (const r of racers){
    if (r.isPlayer || r.finished) continue;
    const diff = P.u - r.u;
    const rubber = Math.max(.93, Math.min(1.05, 1 + diff * .00055));
    const topA = r.def.top * r.p.skill * rubber;
    r.speed += r.def.acc * .92 * dt * Math.max(0, 1 - r.speed / (topA * 1.02));
    r.speed = Math.min(r.speed, topA * 1.04);
    r.latT -= dt;
    if (r.latT <= 0){
      r.latT = 1 + Math.random() * 2.2;
      r.targetLat = (Math.random() - .5) * 10.5;
      for (const o of racers){
        if (o !== r && o.u > r.u && o.u - r.u < 15 && Math.abs(o.lat - r.targetLat) < 3) r.targetLat = o.lat + (r.targetLat > o.lat ? 3.4 : -3.4);
      }
      r.targetLat = Math.max(-6.4, Math.min(6.4, r.targetLat));
    }
    const dLat = r.targetLat - r.lat;
    r.steerVis += ((dLat > .3 ? 1 : dLat < -.3 ? -1 : 0) - r.steerVis) * Math.min(1, dt * 5);
    r.lat += Math.max(-5.6 * dt, Math.min(5.6 * dt, dLat * dt * 2.2));
    r.u += r.speed * dt;
    if (r.u >= TRACK_LEN){ r.finished = true; r.finTime = raceTime; }
  }
  /* --- tabrakan antar mobil + near miss --- */
  for (let a = 0; a < 8; a++) for (let b = a + 1; b < 8; b++){
    const A = racers[a], B = racers[b];
    const du = B.u - A.u, dl = B.lat - A.lat;
    if (Math.abs(du) < 4.6 && Math.abs(dl) < 2.0){
      const push = (2.0 - Math.abs(dl)) * .5 * Math.sign(dl || 1);
      A.lat -= push * .5; B.lat += push * .5;
      const slower = A.speed < B.speed ? A : B;
      slower.speed *= .985;
      if ((A.isPlayer || B.isPlayer) && P.bumpCd <= 0 && Math.abs(A.speed - B.speed) > 4){
        P.bumpCd = .7; shake = .4; noiseHit(.4); showMsg(T('crash'), .8);
        const pose = racerPose(P);
        for (let k = 0; k < 8; k++) spawnP(sparks, pose.pos.x, pose.pos.y + .7, pose.pos.z, (Math.random() - .5) * 6, Math.random() * 4, (Math.random() - .5) * 6, .45);
      }
    }
  }
  for (const r of racers){
    if (r.isPlayer) continue;
    const du = r.u - P.u;
    if (r.prevDu < 0 && du >= 0 && Math.abs(r.lat - P.lat) > 2.0 && Math.abs(r.lat - P.lat) < 3.6 && P.speed > r.speed && !P.finished){
      gaya = Math.min(100, gaya + 26); score += 40;
      showMsg(T('nearmiss'), .9); beep(1180, .12, 'sine', .18, 1560);
    }
    r.prevDu = du;
  }
  P.bumpCd = Math.max(0, P.bumpCd - dt * .5);
  /* pose + roda + api */
  for (const r of racers){
    racerPose(r);
    r.wheelSpin += r.speed * dt / .37;
    r.built.wheels.forEach(w => w.rotation.x = r.wheelSpin);
    r.built.pivots.forEach(pv => pv.rotation.y = -r.steerVis * .42);
    r.built.group.rotation.z = -r.steerVis * .03;
    r.built.head.rotation.y = r.steerVis * .35;
  }
  player.built.flame.material.opacity = (player.isPlayer && nitroOn) ? .55 + Math.random() * .45 : 0;
  player.built.flame.scale.set(.8 + Math.random() * .5, .8 + Math.random() * .5, 1);
  tickP(dust, dt, .5, .96); tickP(sparks, dt, 6, .98);
  computePlaces();
  if (finDelay > 0){ finDelay -= dt; if (finDelay <= 0) finishRace(); }
}
/* ============ KAMERA & HUD ============ */
const camPos = new THREE.Vector3(0, 30, -30);
function updateCam(dt, t){
  const P = player;
  if (state === 'menu' || state === 'done'){
    const c = trackAt(Math.max(0, P.u));
    const px = Math.cos(c.h), pz = -Math.sin(c.h);
    const cx = c.x + px * P.lat, cz = c.z + pz * P.lat;
    const a = t * .3;
    const tx = cx + Math.sin(a) * 9.5, tz = cz + Math.cos(a) * 9.5;
    camPos.x += (tx - camPos.x) * Math.min(1, dt * 2.5);
    camPos.z += (tz - camPos.z) * Math.min(1, dt * 2.5);
    camPos.y += ((c.y + 3.1) - camPos.y) * Math.min(1, dt * 2.5);
    camera.position.copy(camPos);
    camera.lookAt(cx, c.y + 1.1, cz);
    camera.fov += (55 - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix();
    /* figur di samping mobil pemain */
    figure.position.set(c.x + px * (P.lat - 4.1), c.y, c.z + pz * (P.lat - 4.1));
    figure.rotation.y = c.h + .7 + Math.sin(t * .5) * .15;
    figure.userData.head.position.y = 1.72 + Math.sin(t * 2.1) * .014;
    figure.rotation.z = Math.sin(t * 1.4) * .012;
    return;
  }
  const back = 10.6 + P.speed * .022;
  const cb = trackAt(Math.max(0, P.u - back));
  const pb = Math.cos(cb.h), zb = -Math.sin(cb.h);
  const tx = cb.x + pb * P.lat * .55, tz = cb.z + zb * P.lat * .55;
  camPos.x += (tx - camPos.x) * Math.min(1, dt * 7);
  camPos.z += (tz - camPos.z) * Math.min(1, dt * 7);
  camPos.y += ((cb.y + 4.3) - camPos.y) * Math.min(1, dt * 5);
  camera.position.copy(camPos);
  if (shake > 0){ shake -= dt; camera.position.x += (Math.random() - .5) * shake * 1.4; camera.position.y += (Math.random() - .5) * shake; }
  const ca = trackAt(Math.min(TRACK_LEN, P.u + 12));
  const pa2 = Math.cos(ca.h), za = -Math.sin(ca.h);
  camera.lookAt(ca.x + pa2 * P.lat * .8, ca.y + 1.2, ca.z + za * P.lat * .8);
  const targetFov = 62 + (nitroOn ? 7 : 0) + (P.speed / P.def.top) * 4;
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix();
}
function updateHUD(){
  $('pos').textContent = player.place + '/8';
  $('spd').textContent = Math.round(player.speed * 3.6);
  $('gayaFill').style.width = gaya + '%';
  racers.forEach((r, i) => { progDots[i].style.left = Math.max(0, Math.min(100, r.u / TRACK_LEN * 100)) + '%'; });
}
/* ============ LOOP ============ */
const clock = new THREE.Clock();
let elapsed = 0;
function frame(){
  const dt = Math.min(clock.getDelta(), .05);
  elapsed += dt;
  clouds.forEach((cl, i) => { cl.position.x += dt * (1 + i * .13); if (cl.position.x > 1500) cl.position.x = -1500; });
  seaTex.offset.y -= dt * .012; seaTex.offset.x -= dt * .004;
  if (state === 'count'){
    countT -= dt;
    const n = Math.ceil(countT);
    if (n !== lastCount && n > 0){ lastCount = n; $('count').textContent = n; beep(440, .12, 'sine', .2); }
    if (countT <= 0){
      state = 'race'; $('count').textContent = 'GO!';
      beep(880, .35, 'sine', .25);
      showMsg(T('go'), 1);
      setTimeout(() => $('count').style.opacity = 0, 500);
    }
    racers.forEach(r => racerPose(r));
    updateCam(dt, elapsed);
  } else if (state === 'race'){
    step(dt);
    updateCam(dt, elapsed);
    updateHUD();
  } else {
    racers.forEach(r => racerPose(r));
    updateCam(dt, elapsed);
  }
  if (AC && engGain){
    if (state === 'race' || state === 'count'){
      const ratio = player.speed / player.def.top;
      engOsc.frequency.value = 50 + ratio * 165 + (nitroOn ? 26 : 0);
      engOsc2.frequency.value = 25 + ratio * 82;
      engGain.gain.value = .028 + ratio * .075;
    } else engGain.gain.value = .012;
  }
  skyDome.position.x = camera.position.x; skyDome.position.z = camera.position.z;
  if (sun.userData.dir){ const d = sun.userData.dir; sunSpr.position.set(camera.position.x + d.x * 2100, d.y * 2100 + 30, camera.position.z + d.z * 2100); }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);
/* ============ MULAI ============ */
applyMode('day');
applyLang();
$('coins').textContent = SAVE.coins;
figure.visible = true;
if (AUTO){
  setTimeout(() => {
    startRace(QS.get('mode') || 'day');
    const drv = setInterval(() => {
      if (state === 'count') return;
      if (player.finished){ document.title = 'AUTODONE place=' + player.place + ' time=' + player.finTime.toFixed(1); clearInterval(drv); return; }
      input.gas = true;
      let target = 0, danger = null;
      for (const r of racers){
        if (r.isPlayer) continue;
        const du = r.u - player.u;
        if (du > 0 && du < 17 && Math.abs(r.lat - player.lat) < 3.2) danger = r;
      }
      if (danger) target = danger.lat > player.lat ? danger.lat - 3.6 : danger.lat + 3.6;
      target = Math.max(-6, Math.min(6, target));
      input.steer = target > player.lat + .4 ? 1 : target < player.lat - .4 ? -1 : 0;
      input.nitro = gaya > 55;
    }, 90);
  }, 500);
}
</script>


<script>
/* ===== GAYA KOTA MALAM HUJAN — seperti Jakarta Underworld ===== */
{
  /* jalan basah mengkilap + trotoar beton + tanah kota gelap */
  const wetRoad = new THREE.MeshPhongMaterial({ map: asphaltTex, shininess: 30, specular: 0x2c3e50 });
  wetRoad.side = THREE.DoubleSide;
  scene.traverse(o => {
    if (o.isMesh && o.material && o.material.map === asphaltTex) o.material = wetRoad;
    if (o.isMesh && o.material && o.material.map === sandTex) o.material.color.set(0x8f959c);
    if (o.isMesh && o.material && o.material.map === grassTex) o.material.color.set(0x59614f);
    if (o.isMesh && o.material && o.material.map && [asphaltTex, sandTex, grassTex, seaTex].includes(o.material.map)) o.material.side = THREE.DoubleSide;
  });
  /* gedung-gedung di kiri-kanan jalan sepanjang trek */
  const neonCols = [0xff2d95, 0x00e5ff, 0xffb300, 0x7c4dff, 0x00e676, 0xff5722];
  const signTex = canvasTex((x, w, h) => { const g = x.createRadialGradient(32, 32, 2, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, w, h); }, 64, 64);
  const bMat = new THREE.MeshLambertMaterial({ map: winTex });
  let signIdx = 0;
  for (let sPos = 30; sPos < TRACK_LEN; sPos += 46 + Math.random() * 22){
    for (const sd of [-1, 1]){
      if (Math.random() < .14) continue;
      const c = trackAt(sPos + (Math.random() - .5) * 14);
      const px = Math.cos(c.h), pz = -Math.sin(c.h);
      const lat = sd * (19 + Math.random() * 13);
      const bw = 13 + Math.random() * 11, bh = 17 + Math.random() * 38, bd = 13 + Math.random() * 10;
      const b = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), bMat);
      b.position.set(c.x + px * lat, c.y + bh / 2 - 2.5, c.z + pz * lat);
      b.rotation.y = c.h;
      scene.add(b);
      if (signIdx % 3 === 0){
        const col = neonCols[signIdx % neonCols.length];
        const sign = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 1.5), new THREE.MeshBasicMaterial({ color: col }));
        const slat = lat - sd * (bd / 2 + .4);
        sign.position.set(c.x + px * slat, c.y + 5 + Math.random() * (bh * .5), c.z + pz * slat);
        sign.rotation.y = c.h + (sd > 0 ? Math.PI : 0);
        scene.add(sign);
        const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: signTex, color: col, depthWrite: false, transparent: true, opacity: .5 }));
        glow.position.copy(sign.position); glow.scale.set(11, 6, 1);
        scene.add(glow);
      }
      signIdx++;
    }
  }
  /* hujan */
  const streakTex = canvasTex((x, w, h) => {
    const g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(w / 2 - 1.5, 0, 3, h);
  }, 16, 64);
  const RN = 620, rPos = new Float32Array(RN * 3), rOff = [];
  for (let i = 0; i < RN; i++){
    const o = { x: (Math.random() - .5) * 76, y: Math.random() * 44, z: (Math.random() - .5) * 76 };
    rOff.push(o);
    rPos[i * 3] = o.x; rPos[i * 3 + 1] = o.y; rPos[i * 3 + 2] = o.z;
  }
  const rainGeo = new THREE.BufferGeometry();
  rainGeo.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
  const rainMat = new THREE.PointsMaterial({ map: streakTex, color: 0xa9c9ea, size: 1.25, transparent: true, opacity: 0, depthWrite: false });
  const rain = new THREE.Points(rainGeo, rainMat);
  rain.frustumCulled = false;
  scene.add(rain);
  let rainOn = false;
  setInterval(() => {
    if (!rainOn) return;
    const arr = rainGeo.attributes.position.array;
    for (let i = 0; i < RN; i++){
      const o = rOff[i];
      o.y -= 2.1; o.x -= .35;
      if (o.y < 0){ o.y += 44; o.x = (Math.random() - .5) * 76; o.z = (Math.random() - .5) * 76; }
      arr[i * 3] = o.x; arr[i * 3 + 1] = o.y; arr[i * 3 + 2] = o.z;
    }
    rainGeo.attributes.position.needsUpdate = true;
    rain.position.set(camera.position.x, camera.position.y - 21, camera.position.z);
  }, 33);
  const _applyMode = applyMode;
  applyMode = function(key){
    _applyMode(key);
    rainOn = key === 'night';
    rainMat.opacity = rainOn ? .62 : 0;
  };
  applyMode('night');
}
</script>
